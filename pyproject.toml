[project]
name = "tmux-pick"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.36.2",
  "prek>=0.2.27",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["tmux_pick"]

[tool.hatch.build.targets.wheel.force-include]
"tmux_pick/config.default.toml" = "tmux_pick/config.default.toml"

[tool.pytest.ini_options]
pythonpath = "."
